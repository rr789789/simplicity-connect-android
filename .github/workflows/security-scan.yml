name: Secret Scan
on:
  pull_request:
  push:
    branches: [master, main]
jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.84.0
        with:
          extra_args: --only-verified
